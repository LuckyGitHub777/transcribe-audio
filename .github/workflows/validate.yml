name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'app/Transcribe-Audio.ps1',
            'installer/Install-Transcribe-Audio.ps1',
            'installer/Uninstall-Transcribe-Audio.ps1',
            'tests/real_transcription.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Static validation
        run: python tests/static_validate.py

      - name: Engine mock UAT
        run: python tests/test_engine_mock.py

      - name: Runtime probe mock UAT
        run: python tests/test_probe_mock.py
